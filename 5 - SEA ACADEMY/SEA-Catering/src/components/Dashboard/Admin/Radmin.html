<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SEA Catering</title>
</head>
<body>
    <div>
        <h1 style="font-weight: 700;">Admin Dashboard</h1>
        <p style="font-weight: 500;">Tinjau Kinerja Bisnis SEA Catering</p>
    </div>
    <div class="date-group">
        <!-- Dari tanggal -->
        <div class="card-date">
            <label for="start-date">Dari tanggal</label> <br>
            <input type="date" id="start-date">
        </div>
        <!-- Awal tanggal -->
        <div class="card-date">
            <label for="end-date">Sampai tanggal</label> <br>
            <input type="date" id="end-date">            
        </div>
    </div>
    
    <!-- SUBSCRIPTION -->
    <div class="subscription-group">
        <div class="card-subscription">
            <p class="subscription-title">Langganan Baru</p>
            <div style="font-size: 1.75rem; font-weight: 700;">1,248</div>
        </div>
        <div class="card-subscription">
            <p class="subscription-title">Pendapatan Bulanan</p>
            <div style="font-size: 1.75rem; font-weight: 700;">Rp 312.5jt</div>
        </div>
        <div class="card-subscription">
            <p class="subscription-title">Pengaktifan kembali</p>
            <div style="font-size: 1.75rem; font-weight: 700;">187</div>
        </div>
        <div class="card-subscription">
            <p class="subscription-title">Pertumbuhan Langganan</p>
            <div style="font-size: 1.75rem; font-weight: 700;">4,872</div>
        </div>
    </div>
    <!-- SUBSCRIPTION -->
    
    <!-- # -->
    <div style="display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); margin: 1.5rem 0 1.5rem 0; gap: 1rem;">
        <div class="card-subscription">
            <p class="subscription-title">Pertumbuhan Langganan</p>
            <div style="height: 200px; background: #f1f5f9; border-radius: 0.25rem;"></div>
        </div>
        <div class="card-subscription">
            <p class="subscription-title">Pendapatan Bulanan</p>
            <div style="height: 200px; background: #f1f5f9; border-radius: 0.25rem;"></div>
        </div>
    </div>
    <!-- # -->

    <!-- ACTIVITIES -->
    <div class="activites-group">
        <div class="card-activities">
            <p style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem;">Aktivitas Terkini</p>
            <div style="height: 200px; background: #f1f5f9; border-radius: 0.25rem;"></div>
        </div>
    </div>
    <!-- ACTIVITIES -->
</body>

<style>
            /* Base Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 2rem;
            color: #1e293b;
        }

        /* Header Section */
        body > div:first-child {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }

        p {
            color: #64748b;
            margin: 0;
        }

        /* Date Range Picker */
        .date-group {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .card-date {
            border-radius: 0.5rem;
            background: white;
            padding: 1.5rem;
            transition: box-shadow 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-date:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #64748b;
        }

        input[type="date"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.25rem;
            font-family: inherit;
        }

        /* Metrics Cards */
        .subscription-group {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .card-subscription {
            border-radius: 0.5rem;
            background: white;
            padding: 1.5rem;
            transition: box-shadow 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-subscription:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .subscription-title {
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            margin: 0 0 1rem 0;
        }

        /* Charts Section */
        body > div:nth-child(4) {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }

        /* Activities Section */
        .activites-group {
            margin: 1.5rem 0;
        }

        .card-activities {
            border-radius: 0.5rem;
            background: white;
            padding: 1.5rem;
            transition: box-shadow 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            min-height: 300px;
        }

        .card-activities:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .subscription-group {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 768px) {
            .date-group,
            .subscription-group,
            body > div:nth-child(4) {
                grid-template-columns: 1fr;
            }
            
            body {
                padding: 1rem;
            }
        }
</style>
</html>
