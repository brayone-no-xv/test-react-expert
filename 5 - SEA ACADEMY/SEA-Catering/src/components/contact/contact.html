 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

                <div class="flex-2">

                    <p>hello@seacatering.com</p>

            <div class="flex">
                <div class="flex-1">

<!-- Contact -->
<style>
       body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 2rem;
            color: #1e293b;
        }

        /* Contact Section */
        .contact-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .contact-box {
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2.5rem;
        }

        .contact-box h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: #1e293b;
            text-align: center;
        }

        /* Contact Items */
        .flex {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .flex:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .flex-1 {
            flex: 0 0 60px;
        }

        .flex-1 p {
            background: #84cc16;
            border-radius: 5rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin: 0;
        }

        .flex-2 {
            flex: 1;
        }

        .flex-2 h5 {
            font-size: 1.125rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            color: #1e293b;
        }

        .flex-2 p {
            margin: 0;
            color: #64748b;
            line-height: 1.5;
        }

        /* Social Media */
        .contact-box > div:last-child {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid #e2e8f0;
        }

        .contact-box > div:last-child b {
            display: block;
            font-size: 1.125rem;
            margin-bottom: 1rem;
            color: #1e293b;
        }

        .contact-box ul {
            display: flex;
            list-style-type: none;
            padding: 0;
            margin: 0;
            gap: 1rem;
            justify-content: center;
        }

        .contact-box li {
            background: #84cc16;
            padding: 0.75rem;
            border-radius: 5rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.75rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .contact-box li:hover {
            background: #65a30d;
            transform: translateY(-2px);
        }

        /* Responsive Design */
        @media (max-width: 640px) {
            .contact-section {
                padding: 1rem;
            }
            
            .contact-box {
                padding: 1.5rem;
            }
            
            .flex {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            .flex-1 {
                margin-bottom: 0.5rem;
            }
            
            .contact-box ul {
                flex-wrap: wrap;
            }
        }
</style>

</style>
</html>
